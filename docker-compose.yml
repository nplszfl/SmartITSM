version: '3.8'

services:
  smartitsm-ai-worker:
    build: .
    container_name: smartitsm-ai-worker
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=deepseek
      - LLM_DEEPSEEK_API_KEY=${LLM_DEEPSEEK_API_KEY}
      - LLM_DEEPSEEK_BASE_URL=https://api.deepseek.com
      - LLM_DEEPSEEK_MODEL=deepseek-chat
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PREFIX=smartitsm:
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: smartitsm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data: